name: build busybox linux musl

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*-busybox'
    paths:
      - '.github/workflows/build-busybox-linux-musl.yml'
      - 'archive/busybox-1.38.0.tar.bz2'
      - 'etc/busybox/**'
      - 'scripts/build-busybox-musl.sh'
      - 'scripts/package-busybox-musl.sh'
  pull_request:
    paths:
      - '.github/workflows/build-busybox-linux-musl.yml'
      - 'archive/busybox-1.38.0.tar.bz2'
      - 'etc/busybox/**'
      - 'scripts/build-busybox-musl.sh'
      - 'scripts/package-busybox-musl.sh'

permissions:
  contents: read

env:
  SOFTWARE_NAME: busybox
  BUSYBOX_VERSION: '1.38.0'
  MUSL_RELEASE_BASE: https://github.com/hvhghv/cross-software/releases/download/v15.1.0-musl-gcc

jobs:
  build-busybox-linux-musl:
    name: busybox / ${{ matrix.target }} / ${{ matrix.linkage }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64-lto-nodebug.tar.gz
            qemu_runner: ''
            linkage: dynamic
          - arch: x86_64
            target: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64-lto-nodebug.tar.gz
            qemu_runner: ''
            linkage: static
          - arch: arm
            target: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm-lto-nodebug.tar.gz
            qemu_runner: qemu-arm-static
            linkage: dynamic
          - arch: arm
            target: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm-lto-nodebug.tar.gz
            qemu_runner: qemu-arm-static
            linkage: static
          - arch: aarch64
            target: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64-lto-nodebug.tar.gz
            qemu_runner: qemu-aarch64-static
            linkage: dynamic
          - arch: aarch64
            target: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64-lto-nodebug.tar.gz
            qemu_runner: qemu-aarch64-static
            linkage: static
          - arch: riscv64
            target: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64-lto-nodebug.tar.gz
            qemu_runner: qemu-riscv64-static
            linkage: dynamic
          - arch: riscv64
            target: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64-lto-nodebug.tar.gz
            qemu_runner: qemu-riscv64-static
            linkage: static

    steps:
      - name: Normalize matrix linkage
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          linkage='${{ matrix.linkage }}'
          if [ -z "$linkage" ]; then
            linkage=dynamic
          fi
          echo "linkage=$linkage" >> "$GITHUB_OUTPUT"

      - name: Validate BusyBox release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            *-busybox) ;;
            *)
              echo "This workflow only releases busybox tags, got: $tag" >&2
              exit 1
              ;;
          esac
          version="${tag%-busybox}"
          version="${version#v}"
          if [ "$version" != "$BUSYBOX_VERSION" ]; then
            echo "Tag version $version does not match BUSYBOX_VERSION=$BUSYBOX_VERSION" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore musl toolchain cache
        uses: actions/cache@v4
        with:
          path: .cache/musl-toolchains/${{ matrix.target }}
          key: musl-toolchain-${{ runner.os }}-${{ matrix.target }}-${{ matrix.toolchain_asset }}

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            ccache \
            curl \
            file \
            flex \
            perl \
            qemu-user-static

      - name: Verify offline source archives
        shell: bash
        run: sha256sum --ignore-missing -c archive/SHA256SUMS

      - name: Install musl cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          asset='${{ matrix.toolchain_asset }}'
          toolchain_dir="$GITHUB_WORKSPACE/.cache/musl-toolchains/$target"
          archive="$RUNNER_TEMP/$asset"

          gcc_path=
          if [ -d "$toolchain_dir" ]; then
            gcc_path=$(find "$toolchain_dir" -type f -name "${target}-gcc" -print -quit)
          fi

          if [ -n "$gcc_path" ]; then
            echo "using cached musl toolchain from $toolchain_dir"
          else
            rm -rf "$toolchain_dir"
            mkdir -p "$toolchain_dir"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "$archive" "$MUSL_RELEASE_BASE/$asset"
            test -s "$archive"
            checksum_file="$RUNNER_TEMP/musl-toolchain-SHA256SUMS"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
              -o "$checksum_file" "$MUSL_RELEASE_BASE/SHA256SUMS"
            awk -v asset="$asset" '$2 == asset { print; found=1 } END { exit !found }' \
              "$checksum_file" > "$archive.sha256"
            (
              cd "$RUNNER_TEMP"
              sha256sum -c "$(basename "$archive.sha256")"
            )
            tar -xzf "$archive" -C "$toolchain_dir"
          fi

          gcc_path=$(find "$toolchain_dir" -type f -name "${target}-gcc" -print -quit)
          if [ -z "$gcc_path" ]; then
            echo "${target}-gcc not found in $asset" >&2
            find "$toolchain_dir" -maxdepth 4 -type f -name '*-gcc' >&2
            exit 1
          fi

          bin_dir=$(dirname "$gcc_path")
          root_dir=$(dirname "$bin_dir")
          sysroot=$("$gcc_path" -print-sysroot)
          if [ -z "$sysroot" ] || [ ! -d "$sysroot" ]; then
            sysroot="$root_dir/$target"
          fi
          if [ ! -d "$sysroot" ]; then
            echo "musl sysroot not found for $target" >&2
            find "$root_dir" -maxdepth 2 -type d >&2
            exit 1
          fi

          if [ "$target" = riscv64-linux-musl ]; then
            for header in \
              linux/capability.h \
              linux/fs.h \
              linux/kd.h \
              linux/netlink.h \
              linux/version.h \
              linux/vt.h \
              scsi/sg.h
            do
              test -f "$sysroot/include/$header"
            done
          fi

          echo "$bin_dir" >> "$GITHUB_PATH"
          {
            echo "MUSL_CC=$gcc_path"
            echo "MUSL_AR=$bin_dir/$target-ar"
            echo "MUSL_RANLIB=$bin_dir/$target-ranlib"
            echo "MUSL_STRIP=$bin_dir/$target-strip"
            echo "MUSL_SYSROOT=$sysroot"
          } >> "$GITHUB_ENV"

          "$gcc_path" --version
          echo "sysroot=$sysroot"

      - name: Restore BusyBox ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache/busybox/${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}
          key: busybox-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}-${{ matrix.toolchain_asset }}-${{ hashFiles('archive/busybox-1.38.0.tar.bz2', 'scripts/build-busybox-musl.sh') }}
          restore-keys: |
            busybox-ccache-v1-${{ runner.os }}-${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}-${{ matrix.toolchain_asset }}-
            busybox-ccache-v1-${{ runner.os }}-${{ matrix.target }}-

      - name: Reset ccache stats
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/busybox/${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}
        run: ccache --zero-stats || true

      - name: Build BusyBox
        id: build
        shell: bash
        env:
          TARGET_TRIPLET: ${{ matrix.target }}
          TARGET_ARCH: ${{ matrix.arch }}
          LINKAGE: ${{ steps.matrix.outputs.linkage }}
          JOBS: 2
          USE_CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/busybox/${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
        run: bash scripts/build-busybox-musl.sh

      - name: Show ccache stats
        if: always()
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/busybox/${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}
        run: ccache --show-stats || true

      - name: Verify binary linkage and rootfs shape
        shell: bash
        env:
          LINKAGE: ${{ steps.matrix.outputs.linkage }}
          BUSYBOX_BIN: ${{ steps.build.outputs.busybox_bin }}
          ROOTFS_DIR: ${{ steps.build.outputs.rootfs_dir }}
        run: |
          set -euo pipefail
          file "$BUSYBOX_BIN" | tee busybox.file
          if [ "$LINKAGE" = static ]; then
            grep -Eqi 'statically linked|static-pie linked' busybox.file
          else
            grep -qi 'dynamically linked' busybox.file
            test -d "$ROOTFS_DIR/lib"
            test ! -e "$ROOTFS_DIR/usr/bin/busybox"
            test ! -L "$ROOTFS_DIR/usr/bin/busybox"
            test ! -e "$ROOTFS_DIR/usr/sbin/busybox"
            test ! -L "$ROOTFS_DIR/usr/sbin/busybox"
            for dir in \
              bin \
              dev \
              dev/pts \
              dev/shm \
              etc \
              etc/init.d \
              etc/network \
              etc/network/if-down.d \
              etc/network/if-post-down.d \
              etc/network/if-pre-up.d \
              etc/network/if-up.d \
              etc/profile.d \
              home \
              lib \
              media \
              mnt \
              opt \
              proc \
              root \
              run \
              sbin \
              srv \
              srv/ftp \
              sys \
              tmp \
              usr \
              usr/bin \
              usr/lib \
              usr/local \
              usr/local/bin \
              usr/local/lib \
              usr/local/sbin \
              usr/local/share \
              usr/sbin \
              usr/share \
              usr/share/udhcpc \
              var \
              var/cache \
              var/empty \
              var/lib \
              var/log \
              var/spool \
              var/spool/mail \
              var/tmp \
              var/www
            do
              test -d "$ROOTFS_DIR/$dir"
            done
            test -L "$ROOTFS_DIR/var/run"
            test -L "$ROOTFS_DIR/var/lock"
            test -L "$ROOTFS_DIR/dev/fd"
            test -L "$ROOTFS_DIR/dev/stdin"
            test -L "$ROOTFS_DIR/dev/stdout"
            test -L "$ROOTFS_DIR/dev/stderr"
            test -L "$ROOTFS_DIR/dev/ptmx"
            test -L "$ROOTFS_DIR/bin/sh"
            test -L "$ROOTFS_DIR/bin/ash"
            test "$(readlink "$ROOTFS_DIR/bin/sh")" = busybox
            test "$(readlink "$ROOTFS_DIR/bin/ash")" = busybox
            if find "$ROOTFS_DIR/run" -mindepth 1 -print -quit | grep -q .; then
              echo 'rootfs /run must be empty before tmpfs is mounted' >&2
              exit 1
            fi
            test -f "$ROOTFS_DIR/etc/passwd"
            test -f "$ROOTFS_DIR/etc/group"
            test -f "$ROOTFS_DIR/etc/shadow"
            test -f "$ROOTFS_DIR/etc/gshadow"
            grep -qxF 'sshd:x:22:22:SSH privilege separation:/var/empty:/bin/false' "$ROOTFS_DIR/etc/passwd"
            grep -qxF 'sshd:*:0:0:99999:7:::' "$ROOTFS_DIR/etc/shadow"
            grep -qxF 'sshd:x:22:' "$ROOTFS_DIR/etc/group"
            grep -qxF 'sshd:*::' "$ROOTFS_DIR/etc/gshadow"
            test -f "$ROOTFS_DIR/etc/profile"
            grep -qxF 'export LANG=${LANG:-C.UTF-8}' "$ROOTFS_DIR/etc/profile"
            grep -qxF 'export LC_CTYPE=${LC_CTYPE:-C.UTF-8}' "$ROOTFS_DIR/etc/profile"
            test -f "$ROOTFS_DIR/etc/fstab"
            test -L "$ROOTFS_DIR/etc/mtab"
            test -f "$ROOTFS_DIR/etc/hostname"
            test -f "$ROOTFS_DIR/etc/hosts"
            test -f "$ROOTFS_DIR/etc/resolv.conf"
            test -L "$ROOTFS_DIR/etc/resolve"
            test -f "$ROOTFS_DIR/etc/nsswitch.conf"
            test -f "$ROOTFS_DIR/etc/shells"
            grep -qxF '/bin/ash' "$ROOTFS_DIR/etc/shells"
            test -f "$ROOTFS_DIR/etc/securetty"
            test -f "$ROOTFS_DIR/etc/issue"
            test -f "$ROOTFS_DIR/etc/issue.net"
            test -f "$ROOTFS_DIR/etc/motd"
            test -f "$ROOTFS_DIR/etc/mdev.conf"
            test -f "$ROOTFS_DIR/etc/inittab"
            grep -qxF '::sysinit:/etc/init.d/rcS' "$ROOTFS_DIR/etc/inittab"
            grep -qxF '::shutdown:/etc/init.d/rcK' "$ROOTFS_DIR/etc/inittab"
            test -f "$ROOTFS_DIR/etc/network/interface"
            test -x "$ROOTFS_DIR/etc/network/if-up.d/10-resolv"
            test -x "$ROOTFS_DIR/etc/udhcpc.script"
            test -L "$ROOTFS_DIR/usr/share/udhcpc/default.script"
            test "$(readlink "$ROOTFS_DIR/usr/share/udhcpc/default.script")" = '../../../etc/udhcpc.script'
            test -x "$ROOTFS_DIR/etc/init.d/rcS"
            test -x "$ROOTFS_DIR/etc/init.d/rcK"
            for script in S00mount S01mdev S90network S99telnetd K99telnetd K90network K01mdev K00mount; do
              test -x "$ROOTFS_DIR/etc/init.d/$script"
            done
            for script in "$ROOTFS_DIR/etc/init.d/"S[0-9][0-9]*; do
              test "$(head -n 1 "$script")" = '#!/bin/sh'
              grep -qxF 'action=${1:-start}' "$script"
              grep -Eq '^[[:space:]]*start\)' "$script"
              if sh "$script" __unsupported_action__ >/dev/null 2>&1; then
                status=0
              else
                status=$?
              fi
              test "$status" -eq 2
            done
            for script in "$ROOTFS_DIR/etc/init.d/"K[0-9][0-9]*; do
              test "$(head -n 1 "$script")" = '#!/bin/sh'
              grep -qxF 'action=${1:-stop}' "$script"
              grep -Eq '^[[:space:]]*stop\)' "$script"
              if sh "$script" __unsupported_action__ >/dev/null 2>&1; then
                status=0
              else
                status=$?
              fi
              test "$status" -eq 2
            done
            for script in \
              "$ROOTFS_DIR/etc/udhcpc.script" \
              "$ROOTFS_DIR/etc/init.d/"* \
              "$ROOTFS_DIR/etc/network"/if-*.d/*
            do
              test -f "$script" || continue
              sh -n "$script"
            done
            for mount_point in /proc /sys /dev /dev/pts /dev/shm /run /tmp; do
              awk -v target="$mount_point" \
                '$2 == target { found=1 } END { exit !found }' \
                "$ROOTFS_DIR/etc/fstab"
            done
            if find "$ROOTFS_DIR/lib" "$ROOTFS_DIR/usr/lib" -maxdepth 1 \
              \( -type f -o -type l \) \
              ! \( -name '*.so' -o -name '*.so.*' \) \
              -print -quit | grep -q .; then
              echo 'rootfs library directories contain a non-shared-object file' >&2
              exit 1
            fi
            while IFS= read -r -d '' library; do
              target=$(readlink "$library")
              case "$target" in
                /*)
                  echo "absolute runtime library symlink: $library -> $target" >&2
                  exit 1
                  ;;
              esac
              test -f "$library"
              resolved=$(readlink -f "$library")
              case "$resolved" in
                "$ROOTFS_DIR/lib/"*|"$ROOTFS_DIR/usr/lib/"*) ;;
                *)
                  echo "runtime library symlink escapes rootfs: $library -> $target" >&2
                  exit 1
                  ;;
              esac
            done < <(
              find "$ROOTFS_DIR/lib" "$ROOTFS_DIR/usr/lib" -maxdepth 1 \
                -type l -print0
            )
            while IFS= read -r -d '' library; do
              LC_ALL=C readelf -h "$library" | grep -Eq 'Type:[[:space:]]+DYN'
            done < <(
              find "$ROOTFS_DIR/lib" "$ROOTFS_DIR/usr/lib" -maxdepth 1 \
                -type f -print0
            )
            mapfile -t loaders < <(
              find "$ROOTFS_DIR/lib" -maxdepth 1 -type l -name 'ld-musl-*.so.1' -print
            )
            test "${#loaders[@]}" -eq 1
            test "$(readlink "${loaders[0]}")" = libc.so
            test -f "$ROOTFS_DIR/lib/libc.so"
            find "$ROOTFS_DIR/usr/bin" -maxdepth 1 -type l -lname '../../bin/busybox' -print -quit | grep -q .
            find "$ROOTFS_DIR/usr/sbin" -maxdepth 1 -type l -lname '../../bin/busybox' -print -quit | grep -q .
          fi

      - name: Verify init script ordering
        if: steps.matrix.outputs.linkage == 'dynamic'
        shell: bash
        env:
          ROOTFS_DIR: ${{ steps.build.outputs.rootfs_dir }}
        run: |
          set -euo pipefail
          init_dir=$(mktemp -d)
          order_log="$init_dir/order.log"
          export ORDER_LOG="$order_log"

          cat > "$init_dir/record" <<'EOF'
          #!/bin/sh
          printf '%s %s\n' "${0##*/}" "$1" >> "$ORDER_LOG"
          EOF
          chmod 755 "$init_dir/record"
          for script in S99telnetd S90network S01mdev S00mount K00mount K01mdev K90network K99telnetd; do
            cp "$init_dir/record" "$init_dir/$script"
          done

          INIT_DIR="$init_dir" sh "$ROOTFS_DIR/etc/init.d/rcS"
          cat > "$init_dir/expected-start" <<'EOF'
          S00mount start
          S01mdev start
          S90network start
          S99telnetd start
          EOF
          diff -u "$init_dir/expected-start" "$order_log"

          : > "$order_log"
          INIT_DIR="$init_dir" sh "$ROOTFS_DIR/etc/init.d/rcK"
          cat > "$init_dir/expected-stop" <<'EOF'
          K99telnetd stop
          K90network stop
          K01mdev stop
          K00mount stop
          EOF
          diff -u "$init_dir/expected-stop" "$order_log"

      - name: Run smoke tests
        shell: bash
        env:
          LINKAGE: ${{ steps.matrix.outputs.linkage }}
          QEMU_RUNNER: ${{ matrix.qemu_runner }}
          BUSYBOX_BIN: ${{ steps.build.outputs.busybox_bin }}
          ROOTFS_DIR: ${{ steps.build.outputs.rootfs_dir }}
        run: |
          set -euo pipefail

          read_interpreter() {
            LC_ALL=C readelf -l "$1" \
              | sed -n 's|.*program interpreter: \([^]]*\)\].*|\1|p' \
              | head -n 1
          }

          run_target() {
            local binary=$1
            shift

            if [ -n "${QEMU_RUNNER:-}" ]; then
              if [ "$LINKAGE" = dynamic ]; then
                "$QEMU_RUNNER" -L "$ROOTFS_DIR" "$binary" "$@"
                return
              fi
              "$QEMU_RUNNER" "$binary" "$@"
              return
            fi

            if [ "$LINKAGE" = dynamic ]; then
              interp=$(read_interpreter "$binary" || true)
              if [ -n "$interp" ]; then
                "$ROOTFS_DIR$interp" \
                  --library-path "$ROOTFS_DIR/lib:$ROOTFS_DIR/usr/lib" \
                  "$binary" "$@"
                return
              fi
            fi

            "$binary" "$@"
          }

          run_target "$BUSYBOX_BIN" --help
          run_target "$BUSYBOX_BIN" true
          run_target "$BUSYBOX_BIN" sh -c 'echo BUSYBOX_SMOKE_OK'
          run_target "$BUSYBOX_BIN" ash -c 'echo BUSYBOX_ASH_SMOKE_OK'
          LANG=C.UTF-8 LC_CTYPE=C.UTF-8 run_target "$BUSYBOX_BIN" ash -c \
            'printf "BUSYBOX_ASH_UTF8_SMOKE_OK 中文\\n"'
          if [ "$LINKAGE" = dynamic ]; then
            run_target "$BUSYBOX_BIN" ifup -n -a -i "$ROOTFS_DIR/etc/network/interface"
          fi
          for script in \
            "$ROOTFS_DIR/etc/udhcpc.script" \
            "$ROOTFS_DIR/etc/init.d/"* \
            "$ROOTFS_DIR/etc/network"/if-*.d/*
          do
            test -f "$script" || continue
            run_target "$BUSYBOX_BIN" sh -n "$script"
          done

      - name: Package BusyBox
        id: package
        shell: bash
        env:
          TARGET_TRIPLET: ${{ matrix.target }}
          LINKAGE: ${{ steps.matrix.outputs.linkage }}
          BUSYBOX_BIN: ${{ steps.build.outputs.busybox_bin }}
          ROOTFS_DIR: ${{ steps.build.outputs.rootfs_dir }}
          CONFIG_FILE: ${{ steps.build.outputs.config_file }}
        run: bash scripts/package-busybox-musl.sh

      - name: Upload BusyBox artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-${{ env.BUSYBOX_VERSION }}-${{ matrix.target }}-${{ steps.matrix.outputs.linkage }}
          path: |
            ${{ steps.package.outputs.package_file }}
            ${{ steps.package.outputs.checksum_file }}
          if-no-files-found: error

  release-busybox:
    name: release / busybox
    runs-on: ubuntu-22.04
    needs:
      - build-busybox-linux-musl
    if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-busybox')
    permissions:
      contents: write

    steps:
      - name: Download BusyBox artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: busybox-${{ env.BUSYBOX_VERSION }}-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          rm -f SHA256SUMS
          rm -f *.sha256
          find . -maxdepth 1 -type f -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publish BusyBox release assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/busybox-*
            release-artifacts/SHA256SUMS
          fail_on_unmatched_files: true
