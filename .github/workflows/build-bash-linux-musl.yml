name: build bash linux musl

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*-bash'
    paths:
      - '.github/workflows/build-bash-linux-musl.yml'
      - 'archive/bash-5.3.tar.gz'
      - 'patches/bash-5.3/**'
      - 'scripts/build-bash-musl.sh'
      - 'scripts/package-bash-musl.sh'
  pull_request:
    paths:
      - '.github/workflows/build-bash-linux-musl.yml'
      - 'archive/bash-5.3.tar.gz'
      - 'patches/bash-5.3/**'
      - 'scripts/build-bash-musl.sh'
      - 'scripts/package-bash-musl.sh'

permissions:
  contents: read

env:
  SOFTWARE_NAME: bash
  BASH_SOURCE_VERSION: '5.3'
  BASH_PATCH_LEVEL: '15'
  MUSL_RELEASE_BASE: https://github.com/hvhghv/cross-software/releases/download/v15.1.0-musl-gcc

jobs:
  build-bash-linux-musl:
    name: bash / ${{ matrix.target }} / ${{ matrix.linkage }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64-lto-nodebug.tar.gz
            qemu_runner: ''
            linkage: dynamic
          - target: x86_64-linux-musl
            toolchain_asset: musl-toolchain-x86_64-lto-nodebug.tar.gz
            qemu_runner: ''
            linkage: static
          - target: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm-lto-nodebug.tar.gz
            qemu_runner: qemu-arm-static
            linkage: dynamic
          - target: arm-linux-musleabi
            toolchain_asset: musl-toolchain-arm-lto-nodebug.tar.gz
            qemu_runner: qemu-arm-static
            linkage: static
          - target: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64-lto-nodebug.tar.gz
            qemu_runner: qemu-aarch64-static
            linkage: dynamic
          - target: aarch64-linux-musl
            toolchain_asset: musl-toolchain-aarch64-lto-nodebug.tar.gz
            qemu_runner: qemu-aarch64-static
            linkage: static
          - target: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64-lto-nodebug.tar.gz
            qemu_runner: qemu-riscv64-static
            linkage: dynamic
          - target: riscv64-linux-musl
            toolchain_asset: musl-toolchain-riscv64-lto-nodebug.tar.gz
            qemu_runner: qemu-riscv64-static
            linkage: static

    steps:
      - name: Validate Bash release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in *-bash) ;; *) exit 1 ;; esac
          version="${tag%-bash}"; version="${version#v}"
          test "$version" = "$BASH_SOURCE_VERSION"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore musl toolchain cache
        uses: actions/cache@v4
        with:
          path: .cache/musl-toolchains/${{ matrix.target }}
          key: musl-toolchain-${{ runner.os }}-${{ matrix.target }}-${{ matrix.toolchain_asset }}

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils bison build-essential ca-certificates curl file patch qemu-user-static

      - name: Verify offline source archives and patches
        shell: bash
        run: sha256sum --ignore-missing -c archive/SHA256SUMS

      - name: Install musl cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          asset='${{ matrix.toolchain_asset }}'
          toolchain_dir="$GITHUB_WORKSPACE/.cache/musl-toolchains/$target"
          archive="$RUNNER_TEMP/$asset"
          gcc_path=
          if [ -d "$toolchain_dir" ]; then
            gcc_path=$(find "$toolchain_dir" -type f -name "${target}-gcc" -print -quit)
          fi
          if [ -z "$gcc_path" ]; then
            rm -rf "$toolchain_dir"; mkdir -p "$toolchain_dir"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$archive" "$MUSL_RELEASE_BASE/$asset"
            checksum_file="$RUNNER_TEMP/musl-toolchain-SHA256SUMS"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 -o "$checksum_file" "$MUSL_RELEASE_BASE/SHA256SUMS"
            awk -v asset="$asset" '$2 == asset { print; found=1 } END { exit !found }' "$checksum_file" > "$archive.sha256"
            (cd "$RUNNER_TEMP" && sha256sum -c "$(basename "$archive.sha256")")
            tar -xzf "$archive" -C "$toolchain_dir"
            gcc_path=$(find "$toolchain_dir" -type f -name "${target}-gcc" -print -quit)
          fi
          test -n "$gcc_path"
          bin_dir=$(dirname "$gcc_path"); root_dir=$(dirname "$bin_dir")
          sysroot=$($gcc_path -print-sysroot)
          [ -d "$sysroot" ] || sysroot="$root_dir/$target"
          test -d "$sysroot"
          echo "$bin_dir" >> "$GITHUB_PATH"
          {
            echo "MUSL_CC=$gcc_path"
            echo "MUSL_AR=$bin_dir/$target-ar"
            echo "MUSL_RANLIB=$bin_dir/$target-ranlib"
            echo "MUSL_STRIP=$bin_dir/$target-strip"
            echo "MUSL_SYSROOT=$sysroot"
          } >> "$GITHUB_ENV"

      - name: Build Bash
        id: build
        shell: bash
        env:
          TARGET_TRIPLET: ${{ matrix.target }}
          LINKAGE: ${{ matrix.linkage }}
          JOBS: 2
        run: bash scripts/build-bash-musl.sh

      - name: Verify Bash and run smoke test
        shell: bash
        env:
          TARGET_TRIPLET: ${{ matrix.target }}
          LINKAGE: ${{ matrix.linkage }}
          QEMU_RUNNER: ${{ matrix.qemu_runner }}
          BASH_BIN: ${{ steps.build.outputs.bash_bin }}
        run: |
          set -euo pipefail
          file "$BASH_BIN"
          if [ "$LINKAGE" = static ]; then
            ! readelf -d "$BASH_BIN" 2>/dev/null | grep -q '(NEEDED)'
          else
            readelf -l "$BASH_BIN" | grep -q 'program interpreter'
          fi
          run_root="$RUNNER_TEMP/bash-run-root-$TARGET_TRIPLET-$LINKAGE"
          if [ "$LINKAGE" = dynamic ]; then
            rm -rf "$run_root"; mkdir -p "$run_root/lib" "$run_root/usr/lib"
            cp -a "$MUSL_SYSROOT/lib/." "$run_root/lib/"
            [ ! -d "$MUSL_SYSROOT/usr/lib" ] || cp -a "$MUSL_SYSROOT/usr/lib/." "$run_root/usr/lib/"
          fi
          run_bash() {
            if [ -n "${QEMU_RUNNER:-}" ]; then
              if [ "$LINKAGE" = dynamic ]; then
                env LANG=C.UTF-8 LC_CTYPE=C.UTF-8 "$QEMU_RUNNER" -L "$run_root" "$BASH_BIN" \
                  -c 'echo BASH_SMOKE_OK; test "$((2+3))" = 5; printf "BASH_UTF8_SMOKE_OK %s\\n" "$(printf "\\344\\270\\255\\346\\226\\207")"'
              else
                env LANG=C.UTF-8 LC_CTYPE=C.UTF-8 "$QEMU_RUNNER" "$BASH_BIN" \
                  -c 'echo BASH_SMOKE_OK; test "$((2+3))" = 5; printf "BASH_UTF8_SMOKE_OK %s\\n" "$(printf "\\344\\270\\255\\346\\226\\207")"'
              fi
            elif [ "$LINKAGE" = dynamic ]; then
              interp=$(readelf -l "$BASH_BIN" | sed -n 's|.*program interpreter: \([^]]*\)].*|\1|p' | head -1)
              env LANG=C.UTF-8 LC_CTYPE=C.UTF-8 \
                "$run_root$interp" --library-path "$run_root/lib:$run_root/usr/lib" "$BASH_BIN" \
                -c 'echo BASH_SMOKE_OK; test "$((2+3))" = 5; printf "BASH_UTF8_SMOKE_OK %s\\n" "$(printf "\\344\\270\\255\\346\\226\\207")"'
            else
              env LANG=C.UTF-8 LC_CTYPE=C.UTF-8 "$BASH_BIN" \
                -c 'echo BASH_SMOKE_OK; test "$((2+3))" = 5; printf "BASH_UTF8_SMOKE_OK %s\\n" "$(printf "\\344\\270\\255\\346\\226\\207")"'
            fi
          }
          run_bash

      - name: Package Bash
        id: package
        shell: bash
        env:
          TARGET_TRIPLET: ${{ matrix.target }}
          LINKAGE: ${{ matrix.linkage }}
          INSTALL_PREFIX: ${{ steps.build.outputs.install_prefix }}
        run: bash scripts/package-bash-musl.sh

      - name: Upload Bash artifact
        uses: actions/upload-artifact@v4
        with:
          name: bash-${{ env.BASH_SOURCE_VERSION }}-${{ matrix.target }}-${{ matrix.linkage }}
          path: |
            ${{ steps.package.outputs.package_file }}
            ${{ steps.package.outputs.checksum_file }}
          if-no-files-found: error

  release-bash:
    name: release / bash
    runs-on: ubuntu-22.04
    needs: build-bash-linux-musl
    if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-bash')
    permissions:
      contents: write
    steps:
      - name: Download Bash artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bash-${{ env.BASH_SOURCE_VERSION }}-*
          merge-multiple: true
          path: release-artifacts
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish Bash release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS
          fail_on_unmatched_files: true
